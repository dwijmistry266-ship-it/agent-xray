[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentxray"
version = "0.1.0"
description = "X-ray your AI coding agent's session transcripts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dwij Mistry" }]

[project.scripts]
agent-xray = "agentxray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
